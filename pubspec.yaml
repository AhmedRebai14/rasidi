name: rasidi
description: "Rasidi - Monthly Personal Finance Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^14.2.0
  fl_chart: ^0.68.0
  uuid: ^4.4.0
  intl: ^0.20.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4

dependency_overrides:
  image_picker_android: 0.8.12+3
  path_provider_android: 2.2.12
  share_plus: ^10.0.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
